[project]
name = "helmdeep"
version = "0.1.0"
description = "Minimal Python client for the HelmDeep Tool Gateway (MCP 2026-07-28)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["helmdeep*"]
