services:
  kb:
    build: { context: ../../, dockerfile: deploy/docker/Dockerfile, args: { BUILD_PKG: ./cmd/mock-upstream } }
    command: ["-profile=knowledgebase", "-addr=:9000"]

  supplier:
    build: { context: ../../, dockerfile: deploy/docker/Dockerfile, args: { BUILD_PKG: ./cmd/mock-upstream } }
    command: ["-profile=suppliermaster", "-addr=:9000"]

  email:
    build: { context: ../../, dockerfile: deploy/docker/Dockerfile, args: { BUILD_PKG: ./cmd/mock-upstream } }
    command: ["-profile=email", "-addr=:9000"]

  payments:
    build: { context: ../../, dockerfile: deploy/docker/Dockerfile, args: { BUILD_PKG: ./cmd/mock-upstream } }
    command: ["-profile=payments", "-addr=:9000"]

  gateway:
    build: { context: ../../, dockerfile: deploy/docker/Dockerfile }
    # -dev-insecure: this quickstart's config.yaml uses identity.static_tokens
    # (see its own DEVELOPMENT ONLY note) — Milestone M1 refuses to start
    # with static-token identity otherwise. The real path is
    # identity.jwt + internal/devissuer; see docs/adr/0007-credential-broker-scope.md.
    command: ["serve", "-config=/etc/helmdeep/config.yaml", "-dev-insecure"]
    volumes:
      - ./config.yaml:/etc/helmdeep/config.yaml:ro
      - ../policies:/etc/helmdeep/policies:ro
    ports:
      - "8443:8443"
    depends_on:
      - kb
      - supplier
      - email
      - payments
