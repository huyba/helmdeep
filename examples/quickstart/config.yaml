listen: ":8443"
path: "/mcp"

policy:
  path: /etc/helmdeep/policies

audit:
  path: /data/audit.log

# DEVELOPMENT ONLY — see internal/gateway/identity.go. A real deployment
# replaces this whole section with a real identity provider once
# pkg/identity has one; nothing else in this config changes when it does.
identity:
  static_tokens:
    support-token:
      id: agent:support-bot
      kind: agent
      trust_level: 0
    finance-token:
      id: agent:finance-bot
      kind: agent
      trust_level: 0

upstreams:
  - name: knowledgebase
    url: http://kb:9000/mcp
    provenance:
      source: knowledgebase
      trusted: false
  - name: suppliermaster
    url: http://supplier:9000/mcp
    provenance:
      source: suppliermaster
      trusted: true
  - name: email
    url: http://email:9000/mcp
    provenance:
      source: email
      trusted: false
  - name: payments
    url: http://payments:9000/mcp
    provenance:
      source: payments
      trusted: false

# Tool Registry (docs/05-tool-gateway.md §1, Milestone M2): every tool this
# deployment declares. A tool absent here is refused outright, regardless
# of whether an upstream exposes it — see docs/adr/0008-tool-registry.md.
# risk/data_classes/scopes are governance metadata a policy can read
# (input.action.risk, input.action.data_classes, input.action.required_scopes);
# examples/policies/ doesn't use them yet — see examples/policies-tool-registry/
# for a bundle that does.
tools:
  - id: kb.search
    upstream: knowledgebase
    risk: low
  - id: supplier.get_account
    upstream: suppliermaster
    risk: medium
  - id: email.read_latest
    upstream: email
    risk: low
  - id: payments.wire_transfer
    upstream: payments
    risk: high
    data_classes: ["financial"]

# Agent Registry (docs/02-architecture.md §2's Control Plane, the Agent
# Registry milestone): every agent identity this deployment declares. An
# agent id absent here is refused outright, regardless of how it
# authenticated — see docs/adr/0012-agent-registry.md. version is left
# unset for both: this quickstart's static tokens never assert one.
agents:
  - id: agent:support-bot
    owner: support-team
    risk: low
  - id: agent:finance-bot
    owner: finance-team
    risk: medium
