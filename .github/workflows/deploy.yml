name: Deploy

# Continuous deployment to the dev AKS cluster: every push to main builds a
# fresh image tagged with the commit SHA, pushes it to GHCR, then applies
# deploy/k8s/'s manifests and rolls the Deployment to that exact image.
# This is deliberately separate from release.yml (which builds
# version-tagged, multi-arch release artifacts on `v*` tags) — pushing to
# main and cutting a release are different events with different audiences.
on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write
  # Required for azure/login's OIDC federated-credential exchange — no
  # long-lived Azure client secret is stored in this repo at all. See
  # deploy/k8s/README.md for how the federated credential and role
  # assignment were set up.
  id-token: write

env:
  IMAGE: ghcr.io/${{ github.repository }}
  AKS_RESOURCE_GROUP: helmdeep-rg
  AKS_CLUSTER_NAME: helmdeep-aks
  DEPLOYMENT_NAME: helmdeep-tool-gateway

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          # Dockerfile.multiarch cross-compiles natively (no QEMU); the
          # arm64 variant is what the B2pls_v2 (ARM) node pool runs, amd64
          # keeps the image usable anywhere else. See that file's header.
          file: deploy/docker/Dockerfile.multiarch
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Fail fast, per secret, with a clear message — an empty or
      # mistyped secret otherwise surfaces as an opaque azure/login OIDC
      # error, and a separate step per secret means the failing step's
      # *name* alone (visible even without access to log text) says which
      # one is wrong. Checks presence and GUID shape, never prints values.
      - name: Check AZURE_CLIENT_ID secret is set and GUID-shaped
        env:
          VALUE: ${{ secrets.AZURE_CLIENT_ID }}
        run: |
          [[ "$VALUE" =~ ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$ ]] \
            || { echo "::error::AZURE_CLIENT_ID is missing, empty, or not a bare GUID (check for stray whitespace/quotes)"; exit 1; }
      - name: Check AZURE_TENANT_ID secret is set and GUID-shaped
        env:
          VALUE: ${{ secrets.AZURE_TENANT_ID }}
        run: |
          [[ "$VALUE" =~ ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$ ]] \
            || { echo "::error::AZURE_TENANT_ID is missing, empty, or not a bare GUID (check for stray whitespace/quotes)"; exit 1; }
      - name: Check AZURE_SUBSCRIPTION_ID secret is set and GUID-shaped
        env:
          VALUE: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: |
          [[ "$VALUE" =~ ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$ ]] \
            || { echo "::error::AZURE_SUBSCRIPTION_ID is missing, empty, or not a bare GUID (check for stray whitespace/quotes)"; exit 1; }
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - uses: azure/setup-kubectl@v4
      - name: Get AKS credentials
        run: |
          az aks get-credentials \
            --admin \
            --resource-group "$AKS_RESOURCE_GROUP" \
            --name "$AKS_CLUSTER_NAME" \
            --overwrite-existing
      # secret.yaml is deliberately NOT applied here — it ships placeholder
      # values (see its own header comment) and this pipeline has no real
      # credentials to put in it. Populate real secrets once, out of band,
      # with `kubectl create secret generic helmdeep-tool-gateway-secrets
      # --from-literal=...` — every env var referencing it in
      # deployment.yaml is `optional: true`, so a cluster with no such
      # Secret at all still deploys cleanly, just without those upstream
      # credentials configured.
      - name: Apply manifests
        run: |
          kubectl apply -f deploy/k8s/configmap.yaml
          kubectl apply -f deploy/k8s/pvc.yaml
          kubectl apply -f deploy/k8s/service.yaml
      # Apply the Deployment with THIS commit's image already substituted in
      # (--local edits the manifest without touching the cluster), so the
      # pod is replaced exactly once. Applying the manifest's own `:latest`
      # and then running `kubectl set image` would replace it twice, and
      # with strategy Recreate each replacement is real downtime.
      - name: Roll out this commit's image
        run: |
          kubectl set image --local -f deploy/k8s/deployment.yaml \
            "$DEPLOYMENT_NAME=${IMAGE}:${GITHUB_SHA}" -o yaml \
            | kubectl apply -f -
          kubectl rollout status "deployment/$DEPLOYMENT_NAME" --timeout=240s
