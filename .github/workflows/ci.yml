name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  license-headers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Apache 2.0 / Overarching AI LLC header on every .go file
        run: |
          missing=0
          while IFS= read -r -d '' f; do
            if ! head -n 3 "$f" | grep -q "Copyright (c) 2026 Overarching AI LLC"; then
              echo "missing license header: $f"
              missing=1
            fi
          done < <(find . -name '*.go' -not -path './vendor/*' -print0)
          exit $missing

  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build
        run: go build ./...
      - name: Test
        run: go test -race ./...
      - name: Vet
        run: go vet ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v6
        with:
          # Pinned, not `latest`: `latest` means "whatever golangci-lint
          # ships between now and whenever this job next runs," which can
          # introduce new default-enabled rules (or new bugs) with no
          # corresponding change in this repo — a CI failure with no diff
          # to explain it. Bump deliberately, in its own commit, when
          # there's a reason to.
          version: v2.13.2

  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # The vulnerability *database* govulncheck consults is always
      # current regardless of tool version, so pinning here is about tool
      # stability, not stale advisories — same reasoning as golangci-lint
      # above.
      - run: go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
      - run: govulncheck ./...
