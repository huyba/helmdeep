apiVersion: apps/v1
kind: Deployment
metadata:
  name: helmdeep-tool-gateway
  labels:
    app.kubernetes.io/name: helmdeep-tool-gateway
spec:
  # Not >1 yet: internal/gateway's usageTracker (aggregate rate limits) and
  # the provenance cache (internal/gateway/provenance.go) are in-process,
  # per-pod state with no cross-replica coordination. Running >1 replica
  # today silently divides an agent's rate limit across however many pods
  # happen to answer its calls, and provenance learned by one replica is
  # invisible to another. Fix that (shared state, e.g. Redis-backed, or
  # accept the current per-pod semantics explicitly) before scaling out —
  # this is a real limitation, not a placeholder comment.
  replicas: 1
  # Recreate, not the default RollingUpdate: the audit log is a single-writer
  # hash chain on a ReadWriteOnce disk (pvc.yaml), so the old pod must be
  # gone before the new one starts. RollingUpdate would run both at once and
  # deadlock on the disk attach (or, on one node, interleave two writers into
  # one file). Cost: a few seconds of downtime per deploy.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: helmdeep-tool-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: helmdeep-tool-gateway
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532 # matches distroless/static-debian12:nonroot's "nonroot" user
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: helmdeep-tool-gateway
          image: ghcr.io/huyba/helmdeep:latest # built by .github/workflows/deploy.yml; do not run `latest` in a real environment
          imagePullPolicy: IfNotPresent
          # -dev-insecure: configmap.yaml's config.yaml uses
          # identity.static_tokens (see its own DEVELOPMENT ONLY note) —
          # remove this flag once identity.jwt replaces it.
          args: ["serve", "-config=/etc/helmdeep/config.yaml", "-dev-insecure"]
          ports:
            - name: mcp
              containerPort: 8443
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          env:
            # One entry per upstream's `bearer_token_env` in
            # configmap.yaml's config.yaml. secret.yaml is the example;
            # add/remove keyRefs to match your real upstream list.
            - name: EXAMPLE_UPSTREAM_TOKEN
              valueFrom:
                secretKeyRef:
                  name: helmdeep-tool-gateway-secrets
                  key: EXAMPLE_UPSTREAM_TOKEN
                  optional: true
          volumeMounts:
            - name: config
              mountPath: /etc/helmdeep/config.yaml
              subPath: config.yaml
              readOnly: true
            - name: policy
              mountPath: /etc/helmdeep/policies
              readOnly: true
            # readOnlyRootFilesystem above means the container's own
            # filesystem can't take the audit log — it needs a real
            # writable mount. This is a PersistentVolumeClaim (pvc.yaml), so
            # the ledger survives pod restarts and reschedules; fsGroup in
            # the pod securityContext makes the volume writable by the
            # non-root user. See pvc.yaml for the retention caveat.
            - name: data
              mountPath: /data
          # Two endpoints (internal/health), two probes, on purpose:
          #  - readiness -> /healthz: policy bundle loaded AND audit log
          #    writable. Failing it takes the pod out of Service rotation
          #    without restarting it — the right response to a storage or
          #    policy problem, which a restart can't fix.
          #  - liveness -> /livez: the process answers HTTP, nothing more.
          #    Pointing liveness at the dependency checks would make kubelet
          #    kill and restart the pod over a disk problem, a crash loop
          #    instead of a clear "not ready".
          readinessProbe:
            httpGet:
              path: /healthz
              port: mcp
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /livez
              port: mcp
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              # Starting point for a low-traffic gateway instance, not a
              # measured production number — revise from real metrics.
              cpu: 100m
              memory: 128Mi
            limits:
              # Memory: request == limit on purpose. Memory isn't
              # compressible the way CPU is — a pod that's scheduled
              # assuming 128Mi but allowed to balloon to some much larger
              # limit can push its node into memory pressure for
              # *everything else* on that node before this pod itself
              # ever hits its own limit. Keeping them equal means the
              # scheduler's placement decision and the pod's actual
              # ceiling are the same number. If this pod OOMKills, that's
              # a signal to raise both, not to widen the gap.
              memory: 128Mi
              # CPU: limit is well above the request, deliberately, not
              # equal to it. A CPU *limit* is enforced via the kernel CFS
              # quota — a hard, hard-to-diagnose throttle applied even
              # when the node has spare CPU sitting idle. Setting the
              # limit close to typical usage is the single most common
              # cause of "requests get slow under load with no error in
              # the logs and CPU usage graphs that look fine." Give real
              # headroom for bursts (a policy hot-reload, a spike in
              # concurrent tools/call decisions) and let cluster-level
              # bin-packing, not a per-pod throttle, be the thing that
              # decides contention.
              cpu: "1"
      volumes:
        - name: config
          configMap:
            name: helmdeep-tool-gateway-config
        - name: policy
          configMap:
            name: helmdeep-tool-gateway-policy
        - name: data
          persistentVolumeClaim:
            claimName: helmdeep-tool-gateway-audit
