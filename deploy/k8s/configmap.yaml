# Non-secret gateway config. Upstream bearer tokens are deliberately NOT
# here — config.go's `bearer_token_env` field names an environment
# variable for each upstream's credential, and secret.yaml supplies those
# as env vars instead. Never put a real credential in a ConfigMap: it's
# stored unencrypted in etcd and readable by anyone who can `kubectl get
# configmap` in the namespace.
apiVersion: v1
kind: ConfigMap
metadata:
  name: helmdeep-tool-gateway-config
  labels:
    app.kubernetes.io/name: helmdeep-tool-gateway
data:
  config.yaml: |
    listen: ":8443"
    path: "/mcp"

    policy:
      path: /etc/helmdeep/policies
      # decision_timeout: "50ms"   # uncomment once a real (non-embedded) PDP can hang

    audit:
      path: /data/audit.log

    # DEVELOPMENT ONLY — see internal/gateway/identity.go and
    # docs/adr/0007-credential-broker-scope.md. Static-token identity is
    # unverifiable; the Deployment's args must include -dev-insecure for
    # the gateway to even start with this configured (Milestone M1). The
    # real path is `jwt:` here instead (pkg/identity.JWTResolver) once a
    # deployable identity issuer exists — internal/devissuer today has no
    # standalone binary or image; that's Milestone M4's "one-command
    # emulator," not this manifest's job to anticipate. Replace this
    # entire section before this leaves a demo.
    identity:
      static_tokens:
        example-token:
          id: agent:example-bot
          kind: agent
          trust_level: 0

    # Replace with real upstream services once they exist. bearer_token_env
    # names an env var (see secret.yaml) — the token itself never appears
    # in this ConfigMap.
    upstreams: []

    # Tool Registry (docs/05-tool-gateway.md §1, Milestone M2): every tool
    # this deployment declares — a tool absent here is refused outright.
    # Left empty alongside the empty upstreams list above; populate both
    # together with your real tool catalog. See docs/adr/0008-tool-registry.md
    # and examples/quickstart/config.yaml for a filled-in example.
    tools: []

    # Agent Registry (docs/02-architecture.md §2's Control Plane, the
    # Agent Registry milestone): every agent identity this deployment
    # declares — an agent absent here is refused outright, regardless of
    # how it authenticated. Left empty for the same reason tools: is:
    # populate it with your real agent catalog. See
    # docs/adr/0012-agent-registry.md and examples/quickstart/config.yaml
    # for a filled-in example.
    agents: []
---
# The Rego policy bundle, as its own ConfigMap so it can be updated (and
# SIGHUP-reloaded, see cmd/helmdeep-gateway) independently of the rest of
# the config. Replace with your real bundle; this is examples/policies/'s
# deny-by-default shape so a fresh deployment starts closed, not open.
apiVersion: v1
kind: ConfigMap
metadata:
  name: helmdeep-tool-gateway-policy
  labels:
    app.kubernetes.io/name: helmdeep-tool-gateway
data:
  decision.rego: |
    package helmdeep.authz

    default decision := {
      "outcome": "deny",
      "policy_id": "default.deny",
      "reason": "no policy configured for this deployment yet",
    }
