# EXAMPLE ONLY — do not apply as-is and do not commit real values here.
#
# Two realistic ways to manage this in practice, both better than editing
# this file with real secrets and applying it:
#   1. `kubectl create secret generic helmdeep-gateway-secrets
#       --from-literal=SUPPLIERMASTER_TOKEN=<real-value>`
#   2. A secrets operator (External Secrets Operator, Sealed Secrets, or
#      your cloud provider's CSI secret store driver) that materializes
#      this Secret from a real secret manager (Vault, AWS/GCP/Azure secret
#      manager) — the right answer once this is more than a demo, and the
#      direction docs/04-identity-authz.md §3 assumes ("Vault-backed
#      connector credentials").
#
# The placeholder values below are base64 of the literal string
# "placeholder" — deliberately obviously fake, not a real-looking secret
# someone might mistake for one and leave in place.
apiVersion: v1
kind: Secret
metadata:
  name: helmdeep-gateway-secrets
  labels:
    app.kubernetes.io/name: helmdeep-gateway
type: Opaque
data:
  # Referenced from deployment.yaml as env vars matching each upstream's
  # `bearer_token_env` in configmap.yaml. Add one key per upstream that
  # needs a credential; upstreams needing none can omit theirs entirely.
  EXAMPLE_UPSTREAM_TOKEN: cGxhY2Vob2xkZXI=
